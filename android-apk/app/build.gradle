plugins {
    id 'com.android.application'
}

android {
    namespace 'org.fraacmx.huella'
    compileSdk 35

    defaultConfig {
        applicationId "org.fraacmx.huella"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "3.0.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            versionNameSuffix ""
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
