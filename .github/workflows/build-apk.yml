name: Compilar APK Huella

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-apk/**'
      - '.github/workflows/build-apk.yml'
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'icons/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar la PWA dentro de la APK
        run: python3 android-apk/prepare_assets.py

      - name: Compilar APK
        run: gradle -p android-apk :app:assembleDebug --no-daemon --stacktrace

      - name: Preparar APK final
        run: |
          mkdir -p dist
          cp android-apk/app/build/outputs/apk/debug/app-debug.apk dist/Huella.apk
          ls -lh dist/Huella.apk

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Huella-APK
          path: dist/Huella.apk
          if-no-files-found: error
          retention-days: 30
